spring.application.name=cargarage-backend

# ---------- Database ----------
# Values come from environment variables. The part after ':' is the local default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cargarage_db}
spring.datasource.username=${DB_USERNAME:cargarage_app}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA ----------
# Don't keep the database session open while the response is being written
spring.jpa.open-in-view=false