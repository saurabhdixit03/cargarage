spring.application.name=cargarage-backend

# ---------- Database ----------
# Values come from environment variables. The part after ':' is the local default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cargarage_db}
spring.datasource.username=${DB_USERNAME:cargarage_app}
spring.datasource.password=${DB_PASSWORD}

# ---------- Database migrations (Flyway) ----------
# At startup, Flyway runs the SQL files in the location below that haven't run on the database yet,
# in version order (V1__..., V2__...), and records each one in the flyway_schema_history table
spring.flyway.locations=classpath:db/migration

# ---------- JPA ----------
# Don't keep the database session open while the response is being written
spring.jpa.open-in-view=false

# Flyway owns the tables. Hibernate only checks at startup that the entity classes match them,
# and stops the application if they don't, instead of changing the tables itself.
spring.jpa.hibernate.ddl-auto=validate

# Print the SQL Hibernate runs, nicely formatted (helps you learn what JPA does)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Secret key that signs login tokens (HS256). Comes from an environment variable, never from code.
app.jwt.secret=${JWT_SECRET}
# How long a login token stays valid, in minutes
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# ---------- First admin (created at startup only if no admin exists yet) ----------
app.admin.email=${ADMIN_EMAIL:}
app.admin.name=${ADMIN_NAME:Garage Admin}
app.admin.password=${ADMIN_PASSWORD:}
