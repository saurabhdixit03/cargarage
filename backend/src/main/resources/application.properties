spring.application.name=cargarage-backend

# ---------- Database ----------
# Values come from environment variables. The part after ':' is the local default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cargarage_db}
spring.datasource.username=${DB_USERNAME:cargarage_app}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA ----------
# Don't keep the database session open while the response is being written
spring.jpa.open-in-view=false

# Create/update tables automatically from the entity classes (development only)
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs, nicely formatted (helps you learn what JPA does)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true