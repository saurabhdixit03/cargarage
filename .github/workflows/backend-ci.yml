name: Backend CI

# Runs the backend tests on every push to main and on every pull request that touches the backend
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway MySQL just for this run. It's deleted when the job ends.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cargarage_db
          MYSQL_USER: cargarage_app
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        # Wait until MySQL accepts connections before the tests start
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run the tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/cargarage_db
          DB_USERNAME: cargarage_app
          DB_PASSWORD: ci-only-password
          # A test-only key for this run (32 bytes, Base64). The real JWT_SECRET is never in the repository.
          JWT_SECRET: Y2ktb25seS1zZWNyZXQtY2ktb25seS1zZWNyZXQtMTI=
        run: |
          chmod +x mvnw
          ./mvnw -B test